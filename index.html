<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="calculator">
        <div class="screen">
            <div class="screen-top">Previous</div>
            <div class="screen-btm">Current</div>
        </div>
        <div class="row row1">
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>%</div>
        </div>
        <div class="row row2">
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>x</div>
        </div>
        <div class="row row3">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>-</div>
        </div>
        <div class="row row4">
            <div>0</div>
            <div>.</div>
            <div>=</div>
            <div>+</div>
        </div>        
        <div class="row row5">
            <div>AC</div>
            <div>Clear</div>
        </div>
    </div>
    
</body>
</html>
